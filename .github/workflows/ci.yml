name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python validate_notebooks.py
      - name: Smoke test live Streamlit dashboard
        run: |
          python -m streamlit run app.py \
            --server.headless true \
            --server.port 8501 > /tmp/macsentinel-streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/macsentinel-streamlit.log
          exit 1

  swift-sensor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift toolchain
        run: swift --version
      - name: Test native sensor package
        run: swift test --package-path sensor-swift
      - name: Run privacy-safe sensor replay
        run: |
          swift run --package-path sensor-swift --configuration release \
            macsentinel-sensor self-test \
            --input data/synthetic_macos_events.csv
