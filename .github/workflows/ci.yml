name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python validate_notebooks.py

  swift-sensor:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift toolchain
        run: swift --version
      - name: Test native sensor package
        run: swift test --package-path sensor-swift
      - name: Run privacy-safe sensor replay
        run: |
          swift run --package-path sensor-swift --configuration release \
            macsentinel-sensor self-test \
            --input data/synthetic_macos_events.csv
