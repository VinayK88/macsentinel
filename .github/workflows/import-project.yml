name: Import standalone project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-project.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v6

      - name: Import MacSentinel
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/VinayK88/cybersecurity-analytics.git /tmp/cybersecurity-analytics
          source_dir=/tmp/cybersecurity-analytics/macsentinel
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +

          mkdir -p macsentinel
          cp "$source_dir/__init__.py" "$source_dir/core.py" "$source_dir/visuals.py" macsentinel/
          cp "$source_dir/README.md" "$source_dir/app.py" "$source_dir/build_notebooks.py" "$source_dir/validate_notebooks.py" "$source_dir/render_preview.py" .
          cp -R "$source_dir/assets" "$source_dir/data" "$source_dir/notebooks" "$source_dir/sensor-swift" "$source_dir/tests" .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -name '*.pyc' -delete

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "app.py": [
                  ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parent'),
                  ('DATA_PATH = ROOT / "macsentinel" / "data" / "synthetic_macos_events.csv"', 'DATA_PATH = ROOT / "data" / "synthetic_macos_events.csv"'),
              ],
              "build_notebooks.py": [
                  ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parent'),
                  ('PROJECT = ROOT / "macsentinel"', 'PROJECT = ROOT'),
                  ('DATA_PATH = Path("macsentinel/data/synthetic_macos_events.csv")', 'DATA_PATH = Path("data/synthetic_macos_events.csv")'),
              ],
              "validate_notebooks.py": [
                  ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parent'),
                  ('NOTEBOOK_DIR = ROOT / "macsentinel" / "notebooks"', 'NOTEBOOK_DIR = ROOT / "notebooks"'),
              ],
              "render_preview.py": [
                  ('ROOT = Path(__file__).resolve().parents[1]', 'ROOT = Path(__file__).resolve().parent'),
                  ('OUTPUT = ROOT / "macsentinel" / "assets" / "macsentinel-dashboard.png"', 'OUTPUT = ROOT / "assets" / "macsentinel-dashboard.png"'),
              ],
              "tests/test_core.py": [
                  ('ROOT = Path(__file__).resolve().parents[2]', 'ROOT = Path(__file__).resolve().parents[1]'),
                  ('ROOT / "macsentinel" / "app.py"', 'ROOT / "app.py"'),
              ],
              "tests/test_app_smoke.py": [
                  ('ROOT = Path(__file__).resolve().parents[2]', 'ROOT = Path(__file__).resolve().parents[1]'),
                  ('ROOT / "macsentinel" / "app.py"', 'ROOT / "app.py"'),
              ],
              "README.md": [
                  ('streamlit run macsentinel/app.py', 'streamlit run app.py'),
                  ('jupyter lab macsentinel/notebooks', 'jupyter lab notebooks'),
                  ('python -m macsentinel.build_notebooks', 'python build_notebooks.py'),
                  ('python -m macsentinel.validate_notebooks', 'python validate_notebooks.py'),
                  ('python -m unittest discover -s macsentinel/tests -v', 'python -m unittest discover -s tests -v'),
                  ('swift run --package-path macsentinel/sensor-swift', 'swift run --package-path sensor-swift'),
                  ('--input macsentinel/data/synthetic_macos_events.csv', '--input data/synthetic_macos_events.csv'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          for path in Path("notebooks").glob("*.ipynb"):
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace('Path("macsentinel/data/', 'Path("data/'), encoding="utf-8")
          PY

          printf '%s\n' 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'Pillow>=10,<12' 'streamlit>=1.32,<2' > requirements.txt
          printf '%s\n' '__pycache__/' '*.py[cod]' '.pytest_cache/' '.venv/' 'venv/' '.DS_Store' '.build/' > .gitignore


          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import MacSentinel as standalone project"
          git push
